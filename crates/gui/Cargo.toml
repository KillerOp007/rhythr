[package]
name = "rhythia-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rhythia replay renderer (desktop app)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rhythia-errcode.workspace = true
rhythia-formats.workspace = true
rhythia-sim.workspace = true
rhythia-render.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
wgpu = "30"
png = "0.17"
tempfile = "3"
dirs = "6"
usvg = { version = "0.48.1", default-features = false }
ttf-parser = "0.25.1"
fontdb = "0.24.0"
kurbo = "0.13"
tiny-skia-path = "0.12"

[target.'cfg(windows)'.dependencies]
# Unicode-safe registry reads (Steam install path); `reg query` output is
# codepage-encoded and mangles non-ASCII paths.
winreg = "0.55"

[dev-dependencies]
# Test fixtures build small skin archives by hand (the v1 exporter is gone).
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "rhythr"
path = "src/main.rs"
