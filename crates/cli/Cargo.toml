[package]
name = "rhythia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rhythr-cli"
path = "src/main.rs"

[dependencies]
rhythia-errcode.workspace = true
rhythia-formats.workspace = true
rhythia-sim.workspace = true
rhythia-render = { path = "../render" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

[dev-dependencies]
# Building synthetic .rhm archives for the autoplay end-to-end test.
zip = { version = "2", default-features = false, features = ["deflate"] }
